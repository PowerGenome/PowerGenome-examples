name: Test PowerGenome examples

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test-tx-3-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: current-repo

      - name: Checkout PowerGenome repository (main)
        uses: actions/checkout@v4
        with:
          repository: PowerGenome/PowerGenome
          ref: main
          path: PowerGenome

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 'PowerGenome/pyproject.toml'

      - name: Install PowerGenome
        run: |
          pip install -e PowerGenome/.

      - name: Run PowerGenome (TX-3-zone)
        run: |
          cd ${{ github.workspace }}/current-repo
          # Settings are a directory, so all settings file paths (data_location,
          # input_folder, *_table, etc.) resolve relative to the folder that
          # contains the settings dir (example_systems/TX-3-zone/). RESOURCE_GROUPS
          # and RESOURCE_GROUP_PROFILES only get Path() applied (no base-dir
          # resolution), so they resolve relative to this CWD (the repo root) --
          # hence the full example_systems/TX-3-zone/... prefix below.
          # --macro also writes a Macro (simpleCSVinputs) case next to the GenX
          # inputs, at example_systems/TX-3-zone/genx-test/base. Both models are
          # solved from this single PowerGenome run.
          run_powergenome -sf example_systems/TX-3-zone/settings -rf example_systems/TX-3-zone/genx-test -c base --macro

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install GenX.jl
        run: |
          export GENX_PRECOMPILE=false
          # Pin the GenX version for reproducibility. Both TX-3-zone planning
          # periods (2030/2045) have been verified to solve OPTIMAL on 0.4.3 and
          # 0.4.5 (HiGHS). Newer GenX releases are stricter about the Network.csv
          # zone-declaration rows the PowerGenome writer emits, so do not let the
          # version drift past the tested range.
          julia --project -e 'using Pkg; Pkg.add(name="GenX", version="0.4.5")'

      - name: Install MacroEnergy.jl
        run: |
          # Macro gets its own Julia environment so that adding it cannot perturb
          # the GenX project above (they share no dependencies, but they do
          # resolve against the same depot).
          export MACRO_ENV="${{ github.workspace }}/macro-env"
          mkdir -p "${MACRO_ENV}"
          julia --project="${MACRO_ENV}" -e '
            using Pkg
            # 0.2.5 is the latest registered MacroEnergy release. The 0.3.0-rc
            # series moves to a different input format that the PowerGenome
            # macro writer does not target yet, so pin here.
            Pkg.add([
              PackageSpec(name="MacroEnergy", version="0.2.5"),
              PackageSpec(name="HiGHS"),
              # JuMP is a dependency of MacroEnergy but not re-exported; the
              # runner script uses it to check the termination status.
              PackageSpec(name="JuMP"),
            ])
          '
          # Precompile up front so the solve step below reports solver output
          # rather than compilation output.
          julia --project="${MACRO_ENV}" -e 'using MacroEnergy, HiGHS, JuMP'

      - name: Run GenX on both planning periods
        run: |
          set -e
          for period in 1 2; do
            case_dir="${{ github.workspace }}/current-repo/example_systems/TX-3-zone/genx-test/base/Inputs/Inputs_p${period}"
            echo "== Preparing and solving GenX case: Inputs_p${period}"
            # Run.jl uses dirname(@__FILE__) as the case folder, so it must sit
            # directly inside the case directory.
            cp ${{ github.workspace }}/current-repo/example_systems/Run.jl "${case_dir}/"
            mkdir -p "${case_dir}/settings"
            cp ${{ github.workspace }}/current-repo/example_systems/genx_settings/* "${case_dir}/settings/"
            # The example's timeseries are already pre-downsampled to 240 hours by
            # PowerGenome, so disable GenX's own time-domain reduction and solve
            # the inputs as provided.
            sed -i 's/^TimeDomainReduction: 1/TimeDomainReduction: 0/' "${case_dir}/settings/genx_settings.yml"
            cd "${case_dir}"
            julia --project Run.jl
            cd ${{ github.workspace }}/current-repo
          done

      - name: Run Macro on the generated case
        run: |
          set -e
          case_root="${{ github.workspace }}/current-repo/example_systems/TX-3-zone/genx-test/base"
          echo "== Solving Macro case: ${case_root}"
          # RunMacro.jl solves every planning period in the case and exits
          # non-zero unless HiGHS reports OPTIMAL.
          julia --project="${{ github.workspace }}/macro-env" \
            ${{ github.workspace }}/current-repo/example_systems/RunMacro.jl "${case_root}"

      - name: Upload GenX results (period 1)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GenX-results-Inputs_p1
          path: ${{ github.workspace }}/current-repo/example_systems/TX-3-zone/genx-test/base/Inputs/Inputs_p1
          if-no-files-found: ignore

      - name: Upload GenX results (period 2)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GenX-results-Inputs_p2
          path: ${{ github.workspace }}/current-repo/example_systems/TX-3-zone/genx-test/base/Inputs/Inputs_p2
          if-no-files-found: ignore

      - name: Upload Macro results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Macro-results
          # Macro writes one results_NNN folder per run, each holding a
          # subfolder per planning period. The case definition and inputs stay
          # in the workspace (GenX artifacts already cover the shared inputs).
          path: ${{ github.workspace }}/current-repo/example_systems/TX-3-zone/genx-test/base/results_*
          if-no-files-found: ignore
