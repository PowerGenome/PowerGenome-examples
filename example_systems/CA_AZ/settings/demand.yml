# LOAD DATA
# Hourly demand for the 8 CA/AZ ReEDS balancing areas (CA: p8-p11, AZ: p27-p30)
# comes from an up-front ReEDS load table (powergenome / reeds_load_transformed
# format). It has been slimmed to the model BAs and downsampled to 240 hours
# (the first 10 days of weather year 2012) for weather year 2012.
# No AEO growth maps or load-growth assumptions are used.

regional_load_source: reeds

load_source_table_name:
  reeds: demand_load.csv

# Single weather year used for all time-series data (load, VRE profiles,
# distributed generation profiles).
weather_year: 2012
