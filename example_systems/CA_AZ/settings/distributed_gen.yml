# DISTRIBUTED GENERATION
# Existing distributed (rooftop) PV capacity and hourly profiles for the 8 CA/AZ
# BAs are provided in data/distributed_capacity.csv and
# data/distributed_profiles.csv and represented as a dispatchable resource rather
# than being netted out of demand.

# Represent existing distributed generation in each region as a resource
# (rather than subtracting it from demand).
dg_as_resource: true

# Distribution loss used when subtracting distributed generation from total load.
avg_distribution_loss: 0.0453
