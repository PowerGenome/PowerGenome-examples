# SCENARIO MANAGEMENT
# This is a nested dictionary of settings changes for each scenario defined in the
# "scenario_definitions_fn" file.
# - The first set of keys are planning years.
# - The second set of keys are either "all_cases" or the name of a category column in
#   "scenario_definitions_fn" (e.g. "policy"). If "all_cases" then the settings
#   key:value pair is applied to all cases for that year.
# - The third set of keys are the levels (values) that the category column can take.
# - The values under this third set of keys are key:value pairs where the key is a
#   parameter from this settings file with a value that should be modified for a
#   specific case.
#
# This example only has a single baseline case (case_id "base") with no policy
# category, so no scenario-specific settings changes are needed.
settings_management: {}
