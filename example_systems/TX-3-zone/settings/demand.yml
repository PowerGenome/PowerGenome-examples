# LOAD DATA
# Hourly demand for the 7 ERCOT ReEDS balancing areas comes from an up-front
# ReEDS load table (powergenome / reeds_load_transformed format). It has been
# slimmed to the model BAs and downsampled to 876 hours for weather year 2012.
# No AEO growth maps or load-growth assumptions are used.

regional_load_source: reeds

load_source_table_name:
  reeds: reeds_load_tx_3_zone.csv

# Single weather year used for all time-series data (load, VRE profiles,
# distributed generation profiles).
weather_year: 2012
